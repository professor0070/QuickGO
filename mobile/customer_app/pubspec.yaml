name: quickgo_customer_app
description: QuickGO Android-first customer app.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  firebase_core: ^3.1.1
  firebase_messaging: ^15.1.6
  quickgo_shared_api:
    path: ../packages/shared_api
  quickgo_shared_auth:
    path: ../packages/shared_auth
  quickgo_shared_models:
    path: ../packages/shared_models
  quickgo_shared_notifications:
    path: ../packages/shared_notifications
  quickgo_shared_ui:
    path: ../packages/shared_ui
  shared_preferences: ^2.0.15
  image_picker: ^1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/quickgo_logo.jpg
    - assets/go_buddy/character/
    - assets/go_buddy/expressions/
    - assets/go_buddy/poses/
    - assets/go_buddy/states/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/quickgo_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/quickgo_logo.jpg"
  min_sdk_android: 23

